name: Workbench checks
on:
  push:
    branches: [main]
    paths: &source_paths [".gitattributes", "src/**", "native/**", "data/**", "desktop/**", "scripts/**", "tests/**", "tools/**", "web/**", "infra/**", "package*.json", "tsconfig*.json", "vite.config.ts", "playwright.config.ts", ".github/**"]
  pull_request:
    paths: *source_paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Public repository: do not leave the job token in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
        working-directory: infra
      - run: bash scripts/check_cpu.sh infra
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      matrix:
        node: ["24.21.0", "26.10.0"]
    env:
      PAI_BLENDER: ${{ github.workspace }}/.state/tools/blender-5.2.2-linux-x64/blender
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Public repository: do not leave the job token in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - run: npm ci
      - run: bash scripts/check_cpu.sh core
      - name: Fetch pinned native tools and original recording
        run: npm run setup:demo
      - name: Native recording, feedback and independent handoff
        run: npm run test:native
      - name: Current native Blender and generated editable geometry
        if: matrix.node == '24.21.0'
        run: npm run setup:native && npm run test:blender
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: py312
        if: matrix.node == '24.21.0'
        with:
          python-version: "3.12"
          update-environment: false
      - name: Bubblewrap OS sandbox for generated CAD code
        if: matrix.node == '24.21.0'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; the sandbox needs them.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Hash-locked CadQuery 2.8 / OCCT 7.9 and native parametric CAD loop
        if: matrix.node == '24.21.0'
        run: '"${{ steps.py312.outputs.python-path }}" tools/setup_cadquery.py && npm run test:cad'
      - name: Pinned physics toolchain (Gmsh, CalculiX, Optuna, scikit-learn, MuJoCo) and the native structural loop
        if: matrix.node == '24.21.0'
        run: '"${{ steps.py312.outputs.python-path }}" tools/setup_physics.py && npm run test:fea'
      - name: Slim CadQuery runtime lock is current and the AgentCore entrypoint contract holds
        if: matrix.node == '24.21.0'
        run: python3 tools/slim_cadquery_lock.py --python .state/tools/cadquery-2.8.0/bin/python --check && python3 -m pip install -q botocore==1.43.82 && python3 -m unittest discover -s tests/agentcore -p 'test_*.py'
      - name: Generated CadQuery code in the OS sandbox (layers, template equivalence, recheck, limits)
        if: matrix.node == '24.21.0'
        run: npm run test:cad-code
      - name: Native design-space sweep (preset equivalence, lightest feasible point, provenance)
        if: matrix.node == '24.21.0'
        run: npm run test:cad-sweep
      - name: Representative industrial design test cases across all native lanes
        if: matrix.node == '24.21.0'
        run: npm run test:suite
      - run: npx playwright install --with-deps chromium
        if: matrix.node == '24.21.0'
      - name: Desktop, mobile and real video decoding
        if: matrix.node == '24.21.0'
        run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workbench-verification-node-${{ matrix.node }}
          path: |
            .state/evidence/native-e2e.json
            .state/evidence/blender-e2e.json
            .state/evidence/cad-e2e.json
            .state/evidence/cad-code-e2e.json
            .state/evidence/cad-sweep-e2e.json
            .state/evidence/industrial-suite.json
            test-results/
          retention-days: 14
